<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mediocre Applications</title>
<meta name="description" content="Mediocre Applications — small, honest apps. No accounts, no tracking, no nonsense." />
<meta name="robots" content="index, follow" />
<style>
  :root {
    --ink: #1b2630;
    --muted: #5b6b78;
    --line: #e3eaf0;
    --bg: #f7fbff;
    --accent: #0277BD;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
  }
  header {
    background: linear-gradient(135deg, #2b3a47 0%, #16202a 100%);
    color: #fff;
    padding: 64px 22px 56px;
    text-align: center;
  }
  header h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.5px; }
  header p { margin: 12px auto 0; max-width: 520px; opacity: .82; font-size: 16px; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 22px 72px; }
  main { background: #fff; margin-top: -26px; border-radius: 16px;
    box-shadow: 0 1px 0 var(--line), 0 12px 30px rgba(20, 50, 80, .06);
    padding: 30px 30px 36px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 8px 0 16px; }
  .app {
    display: flex; align-items: center; gap: 16px;
    padding: 16px; border: 1px solid var(--line); border-radius: 14px;
    text-decoration: none; color: inherit; transition: box-shadow .15s ease;
  }
  .app:hover { box-shadow: 0 6px 18px rgba(20, 50, 80, .08); }
  .app .icon { width: 52px; height: 52px; border-radius: 13px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, #29B6F6 0%, #0288D1 100%); }
  .app .body { flex: 1; min-width: 0; }
  .app .name { font-size: 18px; font-weight: 700; }
  .app .desc { color: var(--muted); font-size: 15px; margin-top: 2px; }
  .app .links { margin-top: 6px; font-size: 14px; }
  .app .links a { color: var(--accent); text-decoration: none; }
  .app .links a:hover { text-decoration: underline; }
  footer { color: var(--muted); font-size: 14px; text-align: center;
    padding-top: 30px; }
  footer a { color: var(--accent); }
  @media (max-width: 560px) {
    header { padding: 48px 20px 44px; }
    header h1 { font-size: 28px; }
    main { padding: 22px 18px 26px; }
  }
</style>
</head>
<body>
  <header>
    <h1>Mediocre Applications</h1>
    <p>Small, honest apps. No accounts, no tracking, no nonsense — your data
       stays yours.</p>
  </header>

  <div class="wrap">
  <main>
    <h2>Apps</h2>

    <a class="app" href="./hass-todo/privacy/">
      <span class="icon" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 48 48">
          <path d="M13 24.5l7 7 15-16" fill="none" stroke="#fff"
                stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </span>
      <span class="body">
        <span class="name">Todo for Home Assistant</span>
        <span class="desc">Manage your Home Assistant to-do lists, online or off.</span>
        <span class="links"><a href="./hass-todo/privacy/">Privacy policy</a></span>
      </span>
    </a>
  </main>

  <footer>
    Made by Anton · <a href="mailto:anton@adamsen.io">anton@adamsen.io</a>
  </footer>
  </div>
</body>
</html>
